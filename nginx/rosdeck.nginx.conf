# RosDeck Nginx 配置文件
# 前端: 1221 端口，后端: 4162 端口

upstream rosdeck_backend {
    server 127.0.0.1:4162;
    keepalive 32;
}

server {
    listen 1221;
    server_name localhost;
    root /usr/share/nginx/html/rosdeck;

    # ========== 登录页面由后端处理（注入 CSRF Token）==========
    location = /auth/login.html {
        proxy_pass http://rosdeck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }

    # ========== 静态资源（直接返回）==========
    location ^~ /auth/ {
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /libs/ {
        try_files $uri =404;
    }
    location ^~ /modules/ {
        try_files $uri =404;
    }
    location = /index.html {
        try_files $uri =404;
    }

    # ========== API（转发后端）==========
    # 登录接口（允许未登录访问）
    location = /api/auth/login {
        proxy_pass http://rosdeck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }

    # 健康/埋点（允许未登录访问）
    location ~ ^/api/(health|metrics)$ {
        proxy_pass http://rosdeck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }

    # 其它 API 需要会话
    location /api/ {
        if ($http_cookie !~* "session_id=") { return 401; }
        proxy_pass http://rosdeck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }

    # ========== 页面访问保护（没有 session 则跳登录）==========
    location / {
        if ($http_cookie !~* "session_id=") { return 302 /auth/login.html; }
        try_files $uri $uri/ =404;
    }

    # ========== WebSocket ==========
    location /ws/ {
        if ($http_cookie !~* "session_id=") { return 401; }
        proxy_pass http://rosdeck_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
