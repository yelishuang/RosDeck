<div class="terminal-container">
    <!-- Terminal control bar with session controls -->
    <div class="terminal-toolbar">
        <div class="toolbar-left">
            <span class="terminal-status">
                <i class="bi bi-circle-fill status-indicator"></i>
                <span class="status-text">未连接</span>
            </span>
            <span class="terminal-info">
                <i class="bi bi-person-fill"></i>
                <span class="username-text">-</span>
            </span>
        </div>
        <div class="toolbar-right">
            <button class="btn-icon" id="btn-clear" title="清屏 (Ctrl+L)">
                <i class="bi bi-eraser"></i>
            </button>
            <button class="btn-icon" id="btn-history" title="命令历史">
                <i class="bi bi-clock-history"></i>
            </button>
            <button class="btn-icon" id="btn-theme" title="切换主题">
                <i class="bi bi-palette"></i>
            </button>
            <button class="btn-icon" id="btn-log" title="查看日志">
                <i class="bi bi-journal-text"></i>
            </button>
        </div>
    </div>

    <!-- Terminal display area -->
    <div
        id="terminal-display"
        tabindex="0"
        role="textbox"
        aria-label="RosDeck 终端输出"
    ></div>
    <div class="terminal-hint" aria-hidden="true">
        <i class="bi bi-info-circle"></i>
        <span>点击终端区域即可输入，连接建立前的输入会自动排队发送。</span>
    </div>

    <!-- Command history panel -->
    <div class="side-panel" id="history-panel">
        <div class="panel-header">
            <h3>命令历史</h3>
            <button class="btn-close-panel">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="panel-content">
            <div id="history-list" class="history-list">
                <p class="empty-message">暂无命令历史</p>
            </div>
        </div>
    </div>

    <!-- Session log panel -->
    <div class="side-panel" id="log-panel">
        <div class="panel-header">
            <h3>操作日志</h3>
            <button class="btn-close-panel">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="panel-content">
            <div id="log-list" class="log-list">
                <p class="empty-message">暂无日志记录</p>
            </div>
        </div>
    </div>

    <!-- Theme selector panel -->
    <div class="side-panel" id="theme-panel">
        <div class="panel-header">
            <h3>终端主题</h3>
            <button class="btn-close-panel">
                <i class="bi bi-x"></i>
            </button>
        </div>
        <div class="panel-content">
            <div class="theme-grid">
                <div class="theme-option" data-theme="dark">
                    <div class="theme-preview theme-dark"></div>
                    <span>深色 (默认)</span>
                </div>
                <div class="theme-option" data-theme="light">
                    <div class="theme-preview theme-light"></div>
                    <span>浅色</span>
                </div>
                <div class="theme-option" data-theme="dracula">
                    <div class="theme-preview theme-dracula"></div>
                    <span>Dracula</span>
                </div>
                <div class="theme-option" data-theme="monokai">
                    <div class="theme-preview theme-monokai"></div>
                    <span>Monokai</span>
                </div>
            </div>
        </div>
    </div>
</div>
