<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RosDeck | ROS 开发板监控</title>
    <link rel="icon" href="./assets/images/logo.png">
    
    <!-- Bootstrap -->
    <link rel="stylesheet" href="./libs/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="./libs/bootstrap/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./libs/toastr/toastr.min.css">
    
    <!-- 主样式 -->
    <link rel="stylesheet" href="./index.css">

    <!-- 公共样式 -->
    <link rel="stylesheet" href="./shared/css/common.css">

    <meta name="csrf-token" content="">
</head>
<body>
    <!-- 侧边栏 - 替换原 index.html 中的 <aside class="sidebar"> 部分 -->
    <aside class="sidebar">
        <!-- 用户信息 -->
        <div class="user-info">
            <div class="username">openeuler</div>
            <span class="system-id btn-edit" data-editable="false">ye-CNP6S</span>
        </div>
        <hr class="divider">
        
        <!-- 系统分类 -->
        <div class="category-block">
            <div class="category-title">系统</div>
            <ul class="submenu">
                <li class="submenu-item active" data-module="overview">概览</li> 
                <li class="submenu-item" data-module="logs">日志</li>
                <li class="submenu-item" data-module="storage">存储管理</li>
                <li class="submenu-item" data-module="network">网络</li>
                <li class="submenu-item" data-module="runtime">运行中心</li>
            </ul>
        </div>
        <hr class="divider">
        
        <!-- 工具分类 -->
        <div class="category-block">
            <div class="category-title">工具</div>
            <ul class="submenu">
                <li class="submenu-item" data-module="terminal">终端</li>
                <li class="submenu-item" data-module="file-transfer">文件传输</li>
            </ul>
        </div>
        <hr class="divider">
        
        <!-- ROS分类 -->
        <div class="category-block">
            <div class="category-title">ROS</div>
            <ul class="submenu">
                <li class="submenu-item" data-module="ros/overview">ROS 概览</li>
                <li class="submenu-item" data-module="ros/communication">通信监控</li>
                <li class="submenu-item" data-module="ros/operations">采集与配置</li>
                <li class="submenu-item" data-module="ros/ai-commander">ROS-AI</li>
            </ul>
        </div>

        <!-- 重启按钮 -->
        <div class="power-actions">
            <div class="power-btn">
                <div class="power-btn-main">
                    重启
                    <span class="dropdown-arrow">▲</span>
                </div>
                <div class="power-dropdown">
                    <div class="power-option" data-action="restart">重启系统</div>
                    <div class="power-option" data-action="shutdown">关闭系统</div>
                </div>
            </div>
        </div>
    </aside>


    <!-- 主容器 -->
    <main class="main-container">
        <!-- 顶部状态栏 -->
        <div class="status-ribbon">            
            <div class="status-item uptime-item">
                <i class="bi bi-clock-history"></i>
                <span class="status-label">运行</span>
                <span class="status-value" id="uptime-value">3天 2小时</span>
            </div>
            <div class="status-item">
                <i class="bi bi-hdd"></i>
                <span class="status-label">磁盘</span>
                <span class="status-value" id="disk-value">78%</span>
            </div>
            <div class="status-item">
                <i class="bi bi-memory"></i>
                <span class="status-label">内存</span>
                <span class="status-value" id="memory-value">62%</span>
            </div>
            <div class="status-item">
                <i class="bi bi-cpu"></i>
                <span class="status-label">CPU</span>
                <span class="status-value" id="cpu-value">45%</span>
            </div>
            <div class="status-item">
                <i class="bi bi-speedometer2"></i>
                <span class="status-label">网络</span>
                <span class="status-value" id="network-value">15 Mbps</span>
            </div>
        </div>

        <!-- 主顶栏 -->
        <header class="top-bar">
            <div class="top-left">
                <div class="breadcrumb-trail">
                    <span class="trail-home">RosDeck</span>
                    <i class="bi bi-chevron-right trail-sep"></i>
                    <span class="trail-current">概览</span>
                </div>
            </div>
            
            <div class="top-center">
                <div class="device-card">
                    <div class="device-status">
                        <div class="pulse-dot"></div>
                        <span class="device-label">设备在线</span>
                    </div>
                    <div class="device-name">ye-CNP6S</div>
                </div>
            </div>
            
            <div class="top-right">
                <button class="icon-btn notification-btn">
                    <i class="bi bi-bell"></i>
                    <span class="badge">3</span>
                </button>
                
                <div class="user-card">
                    <div class="user-avatar">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name">openeuler</span>
                        <span class="user-role">普通用户</span>
                    </div>
                </div>
                
                <button class="admin-mode-toggle">
                    <span class="toggle-icon">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <span class="toggle-label">
                        <span class="label-text">管理员</span>
                        <span class="label-status">未激活</span>
                    </span>
                </button>
            </div>
        </header>

        <!-- 内容区 -->
        <div class="content-wrapper">
            <div class="content-area">
                <!-- 动态加载的模块内容将显示在这里 -->
                <!-- 默认会加载 modules/overview/index.html -->
            </div>
        </div>
    </main>

    <!-- 脚本 -->
    <script src="./libs/jquery/jquery.min.js"></script>
    <script src="./libs/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="./libs/toastr/toastr.min.js"></script>
    <script src="./index.js"></script>
</body>
</html>
